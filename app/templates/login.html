<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salão Brilho de Cristal - Acesso</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .card { width: 100%; max-width: 400px; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #cbd5e1; }
  .header { background: #1a2b5f; color: #ffffff; padding: 28px 20px; text-align: center; }
  .logo { font-size: 32px; margin-bottom: 8px; }
  .title { font-size: 20px; font-weight: 700; }
  .sub { font-size: 13px; color: #cbd5e1; margin-top: 4px; }
  .body { padding: 24px 20px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 6px; }
  input { width: 100%; height: 48px; border: 2px solid #cbd5e1; border-radius: 8px; padding: 0 12px; font-size: 15px; margin-bottom: 16px; }
  input:focus { border-color: #1a2b5f; outline: none; }
  .btn { width: 100%; height: 50px; background: #1a2b5f; color: #ffffff; font-size: 16px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; }
  .btn:focus { outline: 3px solid #f59e0b; }
  .footer { text-align: center; font-size: 12px; color: #64748b; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">✂️</div>
      <div class="title">Salão Brilho de Cristal</div>
      <div class="sub">Gestão Operacional de Atendimentos</div>
    </div>
    <div class="body">
      <form method="POST" action="/login">
        <label for="email">E-mail ou Usuário</label>
        <input type="text" id="email" name="email" value="maria.gestora@salaobrilho.com" required>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" value="Brilho@2026" required>
        <button type="submit" class="btn">Acessar Grade Diária</button>
      </form>
      <div class="footer">🔒 Ambiente Seguro • Acesso restrito à gestora</div>
    </div>
  </div>
</body>
</html>
